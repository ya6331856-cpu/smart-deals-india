name: Restore Smart Deals India MVP source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack the Next.js project into repository root
        run: |
          test -f smart-deals-upload.zip
          unzip -o smart-deals-upload.zip -d .
          rm smart-deals-upload.zip

      - name: Commit restored project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected."
          else
            git commit -m "Add Smart Deals India Next.js MVP source"
            git push origin HEAD:main
          fi
